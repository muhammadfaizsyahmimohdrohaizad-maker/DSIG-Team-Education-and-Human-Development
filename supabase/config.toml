# Local development only (supabase start). Production settings live in the Supabase dashboard.
project_id = "careerprep"

[api]
# ref holds the read-only reference data (D3). Also add "ref" under Exposed schemas in the dashboard (API settings).
schemas = ["public", "graphql_public", "ref"]
extra_search_path = ["public", "extensions"]

[auth]
site_url = "http://localhost:3000/careerprep"
additional_redirect_urls = ["http://localhost:3000/careerprep/auth/callback"]
minimum_password_length = 8

[db]
major_version = 17

[db.seed]
enabled = true
# Reference content first (generated from content/), then the demo people.
sql_paths = ["./seed_reference.sql", "./seed.sql"]
